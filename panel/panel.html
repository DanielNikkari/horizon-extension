<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="app">

    <!-- ── Main view ── -->
    <div id="main-view">
      <header>
        <div class="header-left">
          <span class="logo">Horizon</span>
          <span class="badge" id="expertise-badge">Intermediate</span>
        </div>
        <div class="header-right">
          <label class="toggle" title="Enable / Disable">
            <input type="checkbox" id="enabled-toggle" checked />
            <span class="slider"></span>
          </label>
          <button id="settings-btn" class="icon-btn" title="Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="input-section">
        <label for="selected-text">Selected text</label>
        <textarea id="selected-text" placeholder="Select text on any webpage…" rows="4" spellcheck="false"></textarea>
        <button id="explain-btn" type="button">Explain</button>
      </section>

      <section id="explanation-section" class="hidden">
        <div id="loading" class="hidden">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div id="explanation-content"></div>
        <div id="error-message" class="hidden error"></div>
      </section>

      <section id="followups-section" class="hidden">
        <p class="followups-label">Explore further</p>
        <ul id="followup-list"></ul>
      </section>

      <div id="empty-state">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
        </svg>
        <p>Highlight text on any page to get an AI explanation.</p>
      </div>
    </div>

    <!-- ── Settings view ── -->
    <div id="settings-view" class="hidden">
      <header>
        <button id="back-btn" class="icon-btn" title="Back">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <span class="settings-title">Settings</span>
      </header>

      <div class="settings-body">

        <div class="settings-group">
          <div class="group-label">Appearance</div>
          <div class="setting-row">
            <span class="setting-name">Theme</span>
            <div class="theme-group" id="theme-group">
              <button class="theme-btn" data-theme="light">Light</button>
              <button class="theme-btn" data-theme="dark">Dark</button>
              <button class="theme-btn" data-theme="system">System</button>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="group-label">Expertise Level</div>
          <div class="segment" id="expertise-group">
            <button class="seg-btn" data-level="beginner">Beginner</button>
            <button class="seg-btn" data-level="intermediate">Intermediate</button>
            <button class="seg-btn" data-level="advanced">Advanced</button>
            <button class="seg-btn" data-level="expert">Expert</button>
          </div>
        </div>

        <div class="settings-group">
          <div class="group-label">AI Model</div>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="ai-mode" value="remote" />
              <div>
                <div class="radio-title">Remote — Claude API</div>
                <div class="radio-desc">Anthropic's hosted models</div>
              </div>
            </label>
            <label class="radio-label">
              <input type="radio" name="ai-mode" value="local" />
              <div>
                <div class="radio-title">Local — Ollama</div>
                <div class="radio-desc">Private, runs on your machine</div>
              </div>
            </label>
          </div>

          <div id="remote-settings" class="sub-settings">
            <div class="field">
              <label for="api-key">API Key</label>
              <div class="input-row">
                <input type="password" id="api-key" placeholder="sk-ant-…" autocomplete="off" />
                <button id="toggle-key" type="button" class="small-btn">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="remote-model">Model</label>
              <input type="text" id="remote-model" placeholder="claude-opus-4-5" />
            </div>
          </div>

          <div id="local-settings" class="sub-settings hidden">
            <div class="field">
              <label for="ollama-host">Ollama Host</label>
              <input type="text" id="ollama-host" placeholder="http://localhost:11434" />
            </div>
            <div class="field">
              <label for="local-model">Model Name</label>
              <input type="text" id="local-model" placeholder="llama3.2" />
            </div>
            <button id="test-btn" type="button" class="secondary-btn">Test Connection</button>
            <div id="test-result" class="hidden test-result"></div>
          </div>
        </div>

        <div class="settings-group">
          <div class="group-label">Behaviour</div>
          <div class="setting-row">
            <div>
              <div class="setting-name">Auto-explain delay</div>
              <div class="setting-desc">Time after releasing selection</div>
            </div>
            <div class="slider-inline">
              <input type="range" id="debounce-slider" min="200" max="2000" step="50" />
              <span id="debounce-value">800ms</span>
            </div>
          </div>
        </div>

        <p class="save-note">All settings are saved automatically</p>
      </div>
    </div>

  </div>
  <script src="panel.js"></script>
</body>
</html>
